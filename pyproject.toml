[project]
name = "echocount"
version = "1.0.0"
description = "Audio source counting, open-vocabulary sound naming, and quality-gated stem separation web app."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "venv",
  "models",
  "checkpoints",
  "data",
  "uploads",
  "deliverables",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S105", "S106", "S107", "UP"]
ignore = ["B008", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"test_templates.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
