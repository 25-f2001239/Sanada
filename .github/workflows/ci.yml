name: CI

on:
  push:
    branches: [main, "cleanup/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint and format check
        run: |
          ruff check --select F401,F841,F811,F821 .
          ruff format --check --line-length 100 .

      - name: Repository hygiene and secret scan
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          errors = []
          forbidden_ext = (".db", ".sqlite", ".sqlite3", ".sql", ".bak", ".pt", ".ckpt", ".safetensors")
          patterns = [
              ("PRIVATE_KEY", re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----")),
              ("BREVO_KEY", re.compile(r"xkeysib-[A-Za-z0-9\-]{20,}")),
              ("GITHUB_PAT", re.compile(r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b")),
              ("AWS_KEY", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("GOOGLE_API_KEY", re.compile(r"\bAIza[0-9A-Za-z_\-]{35}\b")),
          ]
          total_bytes = 0
          for rel in files:
              p = pathlib.Path(rel)
              if rel == ".env" or rel.lower().endswith(forbidden_ext):
                  errors.append(f"Forbidden tracked file: {rel}")
              if p.is_file():
                  sz = p.stat().st_size
                  total_bytes += sz
                  if sz > 1_000_000:
                      errors.append(f"Tracked file exceeds 1 MB: {rel} ({sz} bytes)")
                  try:
                      txt = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for name, rx in patterns:
                      if rx.search(txt):
                          errors.append(f"Potential secret ({name}) in {rel}")
          if total_bytes > 5_000_000:
              errors.append(f"Total tracked repo size exceeds 5 MB ({total_bytes} bytes)")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Hygiene OK: {len(files)} tracked files, {total_bytes / 1024:.1f} KB total, 0 secrets.")
          PY

  weight-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run weight-free security, auth, and privacy suites
        env:
          ECHOCOUNT_SKIP_AUTO_DOWNLOAD: "1"
          ECHOCOUNT_DEV: "0"
        run: |
          python tests/test_security_audit.py
          python tests/test_auth_overhaul.py
          python tests/test_history_privacy.py
